
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: tanyyabalwir/fa2-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: ENVIRONMENT
              value: "production"
