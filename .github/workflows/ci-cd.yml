
name: FA2 CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r docker/backend/requirements.txt

      - name: Run unit tests
        run: python -m pytest docker/backend/test_app.py -v

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/backend
          push: false

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./docker/frontend
          push: false
