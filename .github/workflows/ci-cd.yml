
name: FA2 CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r docker/backend/requirements.txt

      - name: Run unit tests
        run: python -m pytest docker/backend/test_app.py -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish backend
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./docker/backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fa2-backend:latest

      - name: Build and publish frontend
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./docker/frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fa2-frontend:latest
