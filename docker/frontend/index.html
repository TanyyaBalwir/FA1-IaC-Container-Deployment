<!DOCTYPE html>
<html>
<head>
    <title>FA1 Multi Environment Application</title>
</head>

<body>
    <h1>FA1 Infrastructure as Code Demo</h1>

    <h2>Frontend Container</h2>

    <p>Frontend is running successfully inside Docker.</p>

    <p>Environment: <span id="environment">Loading...</span></p>

    <script>
        fetch("/api/environment")
            .then(response => response.json())
            .then(data => {
                document.getElementById("environment").innerText = data.environment;
            })
            .catch(error => {
                document.getElementById("environment").innerText = "Backend unavailable";
            });
    </script>
</body>
</html>
